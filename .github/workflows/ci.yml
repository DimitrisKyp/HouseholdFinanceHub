# Lint, test and build on every push and pull request.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # The build never connects to the database or sends email; these only satisfy
          # code that reads them at import time. Real values live on the server.
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
          BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-for-anything
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: 1
